name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  windows-powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check with Windows PowerShell 5.1
        shell: powershell
        run: |
          .\scripts\check.ps1
          .\scripts\test-token-safety.ps1
      - name: Check with PowerShell 7
        shell: pwsh
        run: |
          .\scripts\check.ps1
          .\scripts\test-token-safety.ps1

  contract:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: dsb-start
      - uses: actions/checkout@v4
        with:
          repository: Stakkkkk/DSB-Core
          path: dsb-core
      - name: Check DSB-Core compatibility contract
        shell: powershell
        run: .\dsb-start\scripts\check-contract.ps1 -DsbCoreRoot .\dsb-core
